name: Release

on:
  push:
    tags:
      # GitHub tag filters are globs; the verification job enforces strict SemVer.
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const tag = process.env.RELEASE_TAG;
          const numeric = '(0|[1-9][0-9]*)';
          const identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)';
          const semver = new RegExp(`^v${numeric}\\.${numeric}\\.${numeric}(?:-${identifier}(?:\\.${identifier})*)?$`);
          if (!semver.test(tag)) throw new Error('Release tag must be v-prefixed SemVer without build metadata');
          NODE
          node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Require release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD

  quality-and-package:
    name: Check, build, and package
    runs-on: ubuntu-latest
    needs: verify-tag
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Pack npm tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tgz="release/npm/vite-plugin-oidc-auth-${version}.tgz"
          mkdir -p release/npm
          npm pack --pack-destination release/npm
          if [ ! -f "${tgz}" ]; then
            echo "No npm tarball found at ${tgz}" >&2
            exit 1
          fi

      - name: Smoke-test npm tarball
        run: node .github/scripts/package-smoke.mjs release/npm/*.tgz

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs: quality-and-package
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Node 24 and npm >= 11.5.1
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          echo "node: ${node_version}"
          case "${node_version}" in
            v24.*) ;;
            *) echo "Expected Node 24, got ${node_version}" >&2; exit 1 ;;
          esac

          npm_version="$(npm --version)"
          echo "npm: ${npm_version}"
          # Trusted publishing (OIDC) requires npm >= 11.5.1.
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm to satisfy trusted publishing (>= 11.5.1)"
            npm install -g npm@11
            echo "npm: $(npm --version)"
          fi

      - name: Download verified npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release/npm

      - name: Publish npm tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="vite-plugin-oidc-auth"
          version="${RELEASE_TAG#v}"
          tgz="release/npm/vite-plugin-oidc-auth-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "Skipping ${name}@${version} (already published)"
            exit 0
          fi

          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            dist_tag="next"
          fi
          echo "Publishing ${tgz} as ${name}@${version} with dist-tag ${dist_tag}"
          npm publish "${tgz}" --provenance --access public --tag "${dist_tag}"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download verified npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release/npm

      - name: Create release and attach npm tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tgz="release/npm/vite-plugin-oidc-auth-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing its npm tarball"
            gh release upload "${RELEASE_TAG}" "${tgz}" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${version}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${tgz}" "${release_args[@]}"
